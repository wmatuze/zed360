services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: zed360
      POSTGRES_USER: zed360
      POSTGRES_PASSWORD: zed360
    ports:
      - "5432:5432"
    volumes:
      - zed360_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zed360 -d zed360"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - zed360_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  zed360_postgres:
  zed360_redis:
